<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f9fc"><meta name="description" content="QR코드 하나로 완성하는 스마트 공장 근태관리, FactoryPass">
  <title>FactoryPass — 스마트 근태관리</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body><div id="app"><div class="boot"><span class="brand-mark">F</span> FactoryPass 불러오는 중…</div></div><div id="toast" class="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js" defer></script><script src="/app.js" defer></script>
<script>window.__factoryPassBootTimer=setTimeout(()=>{const app=document.getElementById('app');if(app&&app.querySelector('.boot')){app.innerHTML='<div class="auth-main" style="min-height:100vh"><section class="auth-box"><h2>페이지를 불러오지 못했습니다.</h2><p class="auth-sub">JavaScript 파일을 불러오지 못했거나 초기화 중 오류가 발생했습니다. 네트워크 상태를 확인한 후 새로고침해 주세요.</p><a class="btn btn-primary" href="/">다시 시도</a></section></div>'}},10000)</script>
</body></html>
